name: Build FuwaFuwa APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Configuration and Icons
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.fuwafuwa --project-name=fuwafuwa
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          content = open(p).read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
          '''
          content = content.replace('<application', perms + '    <application')
          open(p, 'w').write(content)
          "
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          res_map = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          base_res = 'android/app/src/main/res'
          for folder, size in res_map.items():
              target_dir = os.path.join(base_res, folder)
              os.makedirs(target_dir, exist_ok=True)
              target_file = os.path.join(target_dir, 'ic_launcher.png')

              img = Image.new('RGBA', (size, size), (242, 153, 172, 255))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([(1, 1), (size - 2, size - 2)], radius=int(size * 0.22), outline=(255, 230, 238, 255), width=max(1, int(size * 0.03)))

              cx, cy = size // 2, size // 2
              kr = int(size * 0.10)
              draw.polygon([(cx - kr, cy), (cx - int(size * 0.35), cy - int(size * 0.22)), (cx - int(size * 0.38), cy + int(size * 0.22))], fill=(255, 255, 255, 255))
              draw.polygon([(cx + kr, cy), (cx + int(size * 0.35), cy - int(size * 0.22)), (cx + int(size * 0.38), cy + int(size * 0.22))], fill=(255, 255, 255, 255))
              draw.ellipse([(cx - kr, cy - kr), (cx + kr, cy + kr)], fill=(255, 255, 255, 255))
              draw.polygon([(cx - int(kr * 0.7), cy + int(kr * 0.5)), (cx - int(size * 0.25), cy + int(size * 0.40)), (cx - int(size * 0.15), cy + int(size * 0.42))], fill=(255, 255, 255, 240))
              draw.polygon([(cx + int(kr * 0.7), cy + int(kr * 0.5)), (cx + int(size * 0.25), cy + int(size * 0.40)), (cx + int(size * 0.15), cy + int(size * 0.42))], fill=(255, 255, 255, 240))

              img.save(target_file, 'PNG')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuwaFuwa-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
